apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base

commonAnnotations:
  # The RHOAI operator currently bundles older schemas. Let Argo own only these
  # CRDs until the downstream payload catches up; operands remain Managed.
  opendatahub.io/managed: "false"
  # Apply schemas before their custom resources and retain them on removal.
  argocd.argoproj.io/sync-wave: "-20"
  argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false
